[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "grounding-gate"
version = "0.4.0"
description = "Zero-token structural verifier for agent loops: one choke point at the submit boundary enforcing grounding and budget invariants. No LLM calls, stdlib only."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Ciphemon" }]
keywords = [
  "agents",
  "llm",
  "verification",
  "grounding",
  "hallucination",
  "agent-loop",
  "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Optional verify_with LLM tier (grounding_gate.verifiers.llm). The ONLY place
# the Anthropic SDK is declared — the floor (Modules 1-4) stays stdlib-only and
# never imports it.
llm = ["anthropic>=0.40"]
# Convenience extra for examples/tune_presets.py (not shipped in the wheel, so
# this is a dev/example dependency, never a runtime one).
tuning = ["lcb-gate>=0.1"]

[project.urls]
Homepage = "https://github.com/CiphemonJY/grounding-gate"
Repository = "https://github.com/CiphemonJY/grounding-gate"
Issues = "https://github.com/CiphemonJY/grounding-gate/issues"
Changelog = "https://github.com/CiphemonJY/grounding-gate/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/grounding_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
