[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grounding-gate"
version = "0.1.0"
description = "Zero-token structural verifier for agent loops: one choke point at the submit boundary enforcing grounding and budget invariants. No LLM calls, stdlib only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ciphemon" }]
keywords = [
  "agents",
  "llm",
  "verification",
  "grounding",
  "hallucination",
  "agent-loop",
  "guardrails",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/CiphemonJY/grounding-gate"
Issues = "https://github.com/CiphemonJY/grounding-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/grounding_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
